<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Old Testament Typing Challenge</title><style>:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#0d1b30;color:#f5f8ff}*{box-sizing:border-box}body{margin:0;padding:20px}main{max-width:1000px;margin:auto}h1{text-align:center;font-size:clamp(28px,5vw,48px);margin:14px 0 6px}.subtitle{text-align:center;color:#b6c9e4;margin:0 0 22px}.stats{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}.stat{background:#213755;border:1px solid #39577b;padding:12px 22px;border-radius:13px;text-align:center;min-width:120px}.stat small{display:block;color:#bdd0e9}.stat strong{font-size:27px;font-variant-numeric:tabular-nums}.panel{background:#1b304d;border:1px solid #3c597d;border-radius:18px;padding:clamp(18px,4vw,32px);margin-bottom:22px}.prompt{text-align:center;font-size:clamp(21px,4vw,31px);font-weight:900;margin:0 0 18px}.entry{display:flex;gap:10px}.entry input{flex:1;min-width:0;font:inherit;font-size:21px;padding:15px;border:2px solid #7b97ba;border-radius:11px;background:white;color:#12213a}.entry input:focus{outline:3px solid #f7c66c;outline-offset:2px}.btn{font:inherit;font-weight:900;background:#ffcf6a;color:#192a40;border:0;border-radius:11px;padding:14px 24px;cursor:pointer}.btn:disabled{opacity:.5;cursor:default}.feedback{min-height:32px;text-align:center;font-weight:750;margin:16px 0 0}.feedback.bad{color:#ff9ca6}.feedback.good{color:#70e8ad}.bar{height:12px;background:#3a4d69;border-radius:30px;overflow:hidden;margin-bottom:24px}.fill{height:100%;width:0;background:#50ce8b;transition:width .2s}.books{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;list-style:none;padding:0}.books li{background:#192d49;border:1px solid #344e71;border-radius:9px;padding:11px 12px;min-height:48px;font-weight:700;color:#aebed3}.books li.done{background:#14543e;border-color:#33976b;color:#eafff3}.books li.current{border:2px solid #f9cb67;color:#ffe4a2}.bottom{text-align:center;margin:25px}.note{text-align:center;color:#b6c9e4;font-size:14px}a{color:#ffe29a}@media(max-width:650px){.books{grid-template-columns:repeat(2,minmax(0,1fr))}.entry{flex-direction:column}.entry input{width:100%}}@media(max-width:380px){.books{grid-template-columns:1fr}}</style></head><body><main><h1>⌨️ Old Testament TYPE IT IN!</h1><p class="subtitle">39 books. Correct spelling. Correct order. No skipping!</p><div class="stats"><div class="stat"><small>Correct</small><strong id="score">0 / 39</strong></div><div class="stat"><small>Time</small><strong id="time">0:00</strong></div><div class="stat"><small>Progress</small><strong id="percent">0%</strong></div></div><section class="panel"><div class="prompt" id="prompt">Type Book #1</div><form id="form" class="entry" autocomplete="off"><input id="answer" type="text" aria-label="Type the next Old Testament book" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type the next book..." required></form><p id="feedback" class="feedback" aria-live="polite">Start typing! Correct books are accepted automatically.</p></section><div class="bar" role="progressbar" aria-label="Progress" aria-valuemin="0" aria-valuemax="39" aria-valuenow="0" id="progress"><div class="fill" id="fill"></div></div><ol class="books" id="books"></ol><div class="bottom"><button class="btn" id="restart">↻ Restart Challenge</button></div><p class="note">Traditional Protestant Bible order • Exact spelling required • No ads or accounts</p></main><script>const books=["Genesis","Exodus","Leviticus","Numbers","Deuteronomy","Joshua","Judges","Ruth","1 Samuel","2 Samuel","1 Kings","2 Kings","1 Chronicles","2 Chronicles","Ezra","Nehemiah","Esther","Job","Psalms","Proverbs","Ecclesiastes","Song of Solomon","Isaiah","Jeremiah","Lamentations","Ezekiel","Daniel","Hosea","Joel","Amos","Obadiah","Jonah","Micah","Nahum","Habakkuk","Zephaniah","Haggai","Zechariah","Malachi"];let next=0,start=null,timer=null,elapsed=0;const $=id=>document.getElementById(id);function fmt(s){return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}function tick(){if(start!==null){elapsed=Math.floor((Date.now()-start)/1000);$('time').textContent=fmt(elapsed)}}function normalize(s){return s.trim().replace(/\s+/g,' ').toLowerCase()}function draw(){const list=$('books');list.replaceChildren();books.forEach((book,i)=>{const li=document.createElement('li');li.textContent=(i+1)+'. '+(i<next?book:'—');if(i<next)li.className='done';else if(i===next)li.className='current';list.appendChild(li)});$('score').textContent=next+' / 39';$('percent').textContent=Math.round(next/39*100)+'%';$('fill').style.width=(next/39*100)+'%';$('progress').setAttribute('aria-valuenow',next);$('prompt').textContent=next===39?'🏆 PERFECT! ALL 39 BOOKS!':'Type Book #'+(next+1)}$('form').onsubmit=e=>{e.preventDefault();if(next===39)return;const raw=$('answer').value;if(!raw.trim())return;if(start===null){start=Date.now();timer=setInterval(tick,250)}if(normalize(raw)===normalize(books[next])){next++;$('answer').value='';$('feedback').className='feedback good';$('feedback').textContent=next===39?'🏆 Amazing! All 39 books in order! Final time: '+fmt(Math.floor((Date.now()-start)/1000)): '✓ Correct! Keep going!';draw();if(next===39){clearInterval(timer);timer=null;tick();$('answer').disabled=true;}else $('answer').focus()}else{$('feedback').className='feedback bad';$('feedback').textContent='✗ Not quite. Check the spelling and order, then try again.';$('answer').select()}};$('answer').addEventListener('input',()=>{if(next<39&&normalize($('answer').value)===normalize(books[next]))$('form').requestSubmit()});function restart(){if(timer!==null)clearInterval(timer);timer=null;start=null;elapsed=0;next=0;$('time').textContent='0:00';$('answer').disabled=false;;$('answer').value='';$('feedback').className='feedback';$('feedback').textContent='Start typing! Correct books are accepted automatically.';draw();$('answer').focus()}$('restart').onclick=restart;restart();</script></body></html>
