<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Catholic Edition — Old Testament: Fix the Typo!</title><style>*{box-sizing:border-box}body{margin:0;background:#0e1930;color:#f8faff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;padding:14px}main{max-width:800px;margin:auto}h1{text-align:center;font-size:clamp(28px,5vw,44px);margin:8px 0 3px}.sub{text-align:center;color:#b7c9e5;margin:0 0 18px}.stats{display:flex;justify-content:center;gap:10px;margin-bottom:16px}.stat{background:#1d3050;border:1px solid #3b577a;border-radius:10px;padding:8px 20px;text-align:center;min-width:115px}.stat small{display:block;color:#c4d2e6}.stat strong{font-size:24px}.card{background:#1c3151;border:1px solid #405d83;border-radius:18px;padding:clamp(18px,5vw,36px);text-align:center}.counter{font-size:13px;letter-spacing:.13em;color:#c4d5f0;font-weight:800}.typo{font-size:clamp(32px,7vw,57px);color:#ffae77;font-weight:900;letter-spacing:.02em;margin:14px 0 22px;overflow-wrap:anywhere}.card label{display:block;margin-bottom:10px;color:#d2dff2;font-weight:700}.answer{width:100%;font-size:23px;text-align:center;padding:14px;border-radius:10px;border:3px solid #b4c7e4;color:#14203a;background:white}.answer:focus{outline:3px solid #f4c569;outline-offset:2px}.feedback{min-height:28px;margin:12px 0 0;font-weight:800}.good{color:#83f0b1}.bad{color:#ffb4b4}.bar{height:12px;background:#334967;border-radius:30px;overflow:hidden;margin:18px 0 10px}.fill{height:100%;background:#53d49b;width:0;transition:width .2s}.done{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:16px}.chip{font-size:12px;border:1px solid #368c69;background:#1b533e;border-radius:30px;padding:4px 9px}.btn{display:block;margin:20px auto 0;background:#ffd06d;border:0;border-radius:10px;padding:12px 25px;color:#1c2a41;font-weight:900;font-size:16px;cursor:pointer}.note{text-align:center;color:#b9c8dd;font-size:12px;margin-top:16px}</style></head><body><main><h1>✏️ FIX THE TYPO!</h1><p class="sub">Old Testament Edition • 46 misspelled books • Can you fix them all?</p><div class="stats"><div class="stat"><small>CORRECT</small><strong id="score">0 / 46</strong></div><div class="stat"><small>TIME</small><strong id="time">0:00</strong></div></div><section class="card"><div class="counter" id="counter">BOOK 1 OF 46</div><div class="typo" id="typo">GENZIZ</div><label for="answer">Type the correctly spelled Bible book</label><input id="answer" class="answer" type="text" placeholder="Fix the typo..." autocomplete="off" autocapitalize="off" spellcheck="false" aria-describedby="feedback"><div class="feedback" id="feedback" aria-live="polite">Answers are accepted automatically!</div></section><div class="bar" role="progressbar" aria-label="Books completed" aria-valuemin="0" aria-valuemax="46" aria-valuenow="0" id="progress"><div class="fill" id="fill"></div></div><div class="done" id="done"></div><button class="btn" id="restart">↻ Play Again (New Order)</button><p class="note">Capitalization and spaces don't matter. Correct spelling does!</p></main><script>const originals=[["Genesis","Genziz"],["Exodus","Exodous"],["Leviticus","Leviticuss"],["Numbers","Numbars"],["Deuteronomy","Deutronomy"],["Joshua","Joshwa"],["Judges","Judjes"],["Ruth","Ruthe"],["1 Samuel","1 Samual"],["2 Samuel","2 Samual"],["1 Kings","1 Kingz"],["2 Kings","2 Kingz"],["1 Chronicles","1 Chronicals"],["2 Chronicles","2 Chronicals"],["Ezra","Ezrah"],["Nehemiah","Nehemia"],["Tobit","Tobitt"],["Judith","Judeth"],["Esther","Ester"],["1 Maccabees","1 Macabees"],["2 Maccabees","2 Macabees"],["Job","Jobe"],["Psalms","Pslams"],["Proverbs","Proverbes"],["Ecclesiastes","Eclesiastes"],["Song of Solomon","Song of Soloman"],["Wisdom","Wisdum"],["Sirach","Sirak"],["Isaiah","Isiah"],["Jeremiah","Jeramiah"],["Lamentations","Lamentashuns"],["Baruch","Baruk"],["Ezekiel","Ezekial"],["Daniel","Daneil"],["Hosea","Hosiah"],["Joel","Joell"],["Amos","Ammos"],["Obadiah","Obediah"],["Jonah","Jona"],["Micah","Micha"],["Nahum","Nahumh"],["Habakkuk","Habakuk"],["Zephaniah","Zephania"],["Haggai","Hagai"],["Zechariah","Zachariah"],["Malachi","Malachai"]];let questions=[],index=0,started=null,timer=null;const $=id=>document.getElementById(id);const norm=s=>String(s).replace(/[^a-z0-9]/gi,'').toLowerCase();function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function fmt(s){return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}function tick(){if(started!==null)$('time').textContent=fmt(Math.floor((Date.now()-started)/1000))}function render(){const over=index===questions.length;$('score').textContent=index+' / '+questions.length;$('counter').textContent=over?'ALL 46 BOOKS COMPLETE!':'BOOK '+(index+1)+' OF '+questions.length;$('typo').textContent=over?'🏆 YOU FIXED THEM ALL!':questions[index][1].toUpperCase();$('fill').style.width=(100*index/questions.length)+'%';$('progress').setAttribute('aria-valuenow',index);$('answer').disabled=over;if(over){$('feedback').textContent='PERFECT! You corrected every typo! Final time: '+$('time').textContent;$('feedback').className='feedback good'}}function restart(){if(timer)clearInterval(timer);timer=null;started=null;questions=shuffle(originals.map(x=>[...x]));index=0;$('time').textContent='0:00';$('answer').value='';$('answer').disabled=false;$('feedback').className='feedback';$('feedback').textContent='Answers are accepted automatically!';$('done').replaceChildren();render();$('answer').focus()}$('answer').addEventListener('input',()=>{if(index>=questions.length)return;if(started===null){started=Date.now();timer=setInterval(tick,250)}if(norm($('answer').value)===norm(questions[index][0])){const chip=document.createElement('span');chip.className='chip';chip.textContent='✓ '+questions[index][0];$('done').appendChild(chip);index++;$('answer').value='';$('feedback').className='feedback good';$('feedback').textContent='✓ Correct!';tick();render();if(index===questions.length){clearInterval(timer);timer=null}else $('answer').focus()}});$('restart').addEventListener('click',restart);restart();</script></body></html>
