<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Old Testament Survivor — The Dragon Awaits</title>
<style>
*{box-sizing:border-box}html,body{min-height:100%;margin:0}body{display:grid;place-items:center;min-height:100vh;background:radial-gradient(ellipse at 50% 90%,#802c1b 0%,#270e1a 42%,#080911 85%);color:#fff4e3;font-family:Georgia,'Times New Roman',serif;text-align:center;overflow:hidden}
body:before{content:"";position:fixed;inset:-30%;pointer-events:none;background:radial-gradient(circle at 30% 80%,#ff6d271b,transparent 35%),radial-gradient(circle at 70% 40%,#ffba3910,transparent 30%);animation:glow 5s ease-in-out infinite alternate}
main{position:relative;z-index:1;max-width:1050px;padding:40px 24px;border-top:2px solid #b96c38;border-bottom:2px solid #b96c38}
small{display:block;font:700 clamp(13px,2vw,19px) system-ui,sans-serif;letter-spacing:.35em;color:#e5a96e;margin-bottom:26px}
h1{font-size:clamp(43px,7.5vw,94px);line-height:1.16;margin:0;text-shadow:0 5px 12px #000,0 0 38px #dc3f2c;font-weight:900;letter-spacing:.035em}
p{font:600 clamp(13px,2vw,18px) system-ui,sans-serif;color:#e0a979;letter-spacing:.24em;margin:28px 0 0}
.ember{position:fixed;width:4px;height:4px;background:#ff9e47;border-radius:50%;box-shadow:0 0 15px #f63;animation:rise 9s linear infinite;bottom:-15px;left:var(--x);animation-delay:var(--d)}
@keyframes rise{to{transform:translateY(-110vh) translateX(80px);opacity:0}}@keyframes glow{to{filter:brightness(1.5);transform:scale(1.07)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body>
